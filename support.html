<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Support</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="search.html">Search</a>
      <a href="profile.html">Profile</a>
      <a href="admin.html">Admin</a>
      <a href="support.html">Support</a>
      <a href="product.html">Products</a>
      <button id="logoutBtn">Logout</button>
    </nav>
    <h1>Professional Services Platform</h1>
  </header>
  <div class="container">
    <h2>Customer Support</h2>
    <table id="inquiriesTable" class="support-table">
      <thead>
        <tr>
          <th>User</th>
          <th>Issue</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Populated by JS -->
      </tbody>
    </table>
    <form id="addInquiryForm" style="display:none;">
      <h3>Simulate New Inquiry (for testing)</h3>
      <input type="text" placeholder="User Name" required>
      <textarea placeholder="Issue Description" required></textarea>
      <button type="submit">Add Inquiry</button>
    </form>
  </div>
  <script src="script.js"></script>
  <script>
    // Support logic
    document.addEventListener('DOMContentLoaded', function() {
      const currentUser = JSON.parse(localStorage.getItem('currentUser'));
      if (!currentUser || currentUser.role !== 'Support') {
        alert('Access restricted to Customer Support only.');
        window.location.href = 'dashboard.html';
        return;
      }

      // Mock inquiries if not in localStorage
      let inquiries = JSON.parse(localStorage.getItem('inquiries')) || [
        { id: 1, user: 'Alice', issue: 'Payment issue with hire', status: 'Open' },
        { id: 2, user: 'Bob', issue: 'Professional not responding', status: 'Resolved' },
        { id: 3, user: 'Charlie', issue: 'Account access problem', status: 'Open' }
      ];
      localStorage.setItem('inquiries', JSON.stringify(inquiries));

      loadInquiries();

      // Add inquiry form for testing (visible only in support)
      document.getElementById('addInquiryForm').style.display = 'block';
      document.getElementById('addInquiryForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = this.querySelector('input').value;
        const issue = this.querySelector('textarea').value;
        if (user && issue) {
          inquiries.push({ id: Date.now(), user, issue, status: 'Open' });
          localStorage.setItem('inquiries', JSON.stringify(inquiries));
          loadInquiries();
          this.reset();
          alert('Inquiry added for testing.');
        }
      });

      function loadInquiries() {
        inquiries = JSON.parse(localStorage.getItem('inquiries')) || [];
        const tbody = document.querySelector('#inquiriesTable tbody');
        tbody.innerHTML = '';
        inquiries.forEach(inquiry => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${inquiry.user}</td>
            <td>${inquiry.issue}</td>
            <td>${inquiry.status}</td>
            <td>
              ${inquiry.status === 'Open' ? `<button onclick="resolveInquiry(${inquiry.id})">Resolve</button>` : 'Resolved'}
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      window.resolveInquiry = function(id) {
        if (confirm('Mark this inquiry as resolved?')) {
          inquiries = inquiries.map(i => i.id === id ? { ...i, status: 'Resolved' } : i);
          localStorage.setItem('inquiries', JSON.stringify(inquiries));
          loadInquiries();
          alert('Inquiry resolved!');
        }
      };

      checkLoginStatus(); // From script.js
    });
  </script>
</body>
</html>
