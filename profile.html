<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="search.html">Search</a>
      <a href="profile.html">Profile</a>
      <a href="admin.html">Admin</a>
      <a href="support.html">Support</a>
      <a href="product.html">Products</a>
      <button id="logoutBtn">Logout</button>
    </nav>
    <h1>Professional Services Platform</h1>
  </header>
  <div class="container">
    <h2>Manage Profile</h2>
    <form id="profileForm" class="profile-form">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="email" id="email" placeholder="Email" required>
      <textarea id="bio" placeholder="Bio/Description" rows="4"></textarea>
      <div id="servicesSection" style="display:none;">
        <h3>Your Services</h3>
        <input type="text" id="serviceName" placeholder="Service Name">
        <input type="text" id="serviceDesc" placeholder="Description">
        <button type="button" onclick="addService()">Add Service</button>
        <ul id="servicesList"></ul>
      </div>
      <button type="submit">Save Profile</button>
    </form>
    <div id="feedbackSection" style="display:none; margin-top: 20px;">
      <h3>Feedback</h3>
      <textarea id="feedbackText" placeholder="Enter feedback..."></textarea>
      <button onclick="submitFeedback()">Submit Feedback</button>
    </div>
  </div>
  <script src="script.js"></script>
  <script>
    // Profile logic
    document.addEventListener('DOMContentLoaded', function() {
      const currentUser = JSON.parse(localStorage.getItem('currentUser'));
      if (!currentUser || (currentUser.role !== 'User' && currentUser.role !== 'Professional')) {
        alert('Access restricted to Users and Professionals only.');
        window.location.href = 'dashboard.html';
        return;
      }

      // Load current profile
      document.getElementById('name').value = currentUser.name || '';
      document.getElementById('email').value = currentUser.email || '';
      document.getElementById('bio').value = currentUser.bio || '';

      if (currentUser.role === 'Professional') {
        document.getElementById('servicesSection').style.display = 'block';
        loadServices(currentUser.services || []);
      }

      if (currentUser.role === 'User') {
        document.getElementById('feedbackSection').style.display = 'block';
      }

      document.getElementById('profileForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const updatedUser = {
          ...currentUser,
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          bio: document.getElementById('bio').value
        };
        if (currentUser.role === 'Professional') {
          updatedUser.services = currentUser.services || [];
        }
        localStorage.setItem('currentUser', JSON.stringify(updatedUser));

        // Update in users array
        let users = JSON.parse(localStorage.getItem('users')) || [];
        const index = users.findIndex(u => u.email === currentUser.email);
        if (index > -1) {
          users[index] = updatedUser;
          localStorage.setItem('users', JSON.stringify(users));
        }

        alert('Profile updated successfully!');
      });

      checkLoginStatus(); // From script.js
    });

    let currentServices = [];

    function loadServices(services) {
      currentServices = services;
      const list = document.getElementById('servicesList');
      list.innerHTML = '';
      services.forEach(service => {
        const li = document.createElement('li');
        li.textContent = `${service.name}: ${service.desc}`;
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete';
        deleteBtn.onclick = () => deleteService(service.name);
        li.appendChild(deleteBtn);
        list.appendChild(li);
      });
    }

    function addService() {
      const name = document.getElementById('serviceName').value;
      const desc = document.getElementById('serviceDesc').value;
      if (name && desc) {
        currentServices.push({ name, desc });
        loadServices(currentServices);
        document.getElementById('serviceName').value = '';
        document.getElementById('serviceDesc').value = '';
        // Update currentUser
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        currentUser.services = currentServices;
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
      } else {
        alert('Please fill service name and description.');
      }
    }

    function deleteService(name) {
      currentServices = currentServices.filter(s => s.name !== name);
      loadServices(currentServices);
      const currentUser = JSON.parse(localStorage.getItem('currentUser'));
      currentUser.services = currentServices;
      localStorage.setItem('currentUser', JSON.stringify(currentUser));
    }

    function submitFeedback() {
      const feedback = document.getElementById('feedbackText').value;
      if (feedback) {
        alert('Feedback submitted! Thank you.');
        document.getElementById('feedbackText').value = '';
        // In real app, store or send feedback
      } else {
        alert('Please enter feedback.');
      }
    }
  </script>
</body>
</html>
