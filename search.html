<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Professionals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="search.html">Search</a>
      <a href="profile.html">Profile</a>
      <a href="admin.html">Admin</a>
      <a href="support.html">Support</a>
      <a href="product.html">Products</a>
      <button id="logoutBtn">Logout</button>
    </nav>
    <h1>Professional Services Platform</h1>
  </header>
  <div class="container">
    <h2>Search for Professionals</h2>
    <form id="searchForm" class="search-form">
      <input type="text" id="serviceSearch" placeholder="Service (e.g., Plumbing)" required>
      <input type="text" id="locationSearch" placeholder="Location (e.g., New York)">
      <button type="submit">Search</button>
    </form>
    <div id="searchResults" class="search-results">
      <!-- Results populated by JS -->
    </div>
  </div>
  <script src="script.js"></script>
  <script>
    // Search logic
    document.addEventListener('DOMContentLoaded', function() {
      const currentUser = JSON.parse(localStorage.getItem('currentUser'));
      if (!currentUser || currentUser.role !== 'User') {
        alert('Access restricted to Users only.');
        window.location.href = 'dashboard.html';
        return;
      }

      const form = document.getElementById('searchForm');
      const results = document.getElementById('searchResults');

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const service = document.getElementById('serviceSearch').value.toLowerCase();
        const location = document.getElementById('locationSearch').value.toLowerCase();

        let filtered = professionals.filter(pro => 
          pro.service.toLowerCase().includes(service) &&
          (!location || pro.location.toLowerCase().includes(location))
        );

        if (filtered.length === 0) {
          results.innerHTML = '<p>No professionals found.</p>';
          return;
        }

        let html = '';
        filtered.forEach(pro => {
          html += `
            <div class="professional-card">
              <h3>${pro.name}</h3>
              <p>Service: ${pro.service}</p>
              <p>Location: ${pro.location}</p>
              <p>Rating: ${pro.rating} ⭐</p>
              <button onclick="hireProfessional(${pro.id})">Hire</button>
            </div>
          `;
        });
        results.innerHTML = html;
      });

      checkLoginStatus(); // From script.js
    });

    function hireProfessional(id) {
      alert(`Hired professional ID: ${id}. Request sent!`);
      // In real app, send request to backend or store in localStorage
    }
  </script>
</body>
</html>
